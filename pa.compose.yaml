# Plausible Community Edition v3.2.1; stack name: pa.
# See pa/README.md for deployment and backup instructions.
services:
  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      start_period: 1m

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - /pettan/self/pa/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - /pettan/self/pa/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - /pettan/self/pa/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - /pettan/self/pa/clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    env_file: /etc/.env/pa
    environment:
      BASE_URL: https://pa.joshwel.co
      HTTP_PORT: "8000"
      TMPDIR: /var/lib/plausible/tmp
      DISABLE_REGISTRATION: invite_only
    volumes:
      - plausible-data:/var/lib/plausible
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      default:
      caddy:
        aliases: [pa]

networks:
  caddy:
    external: true
    name: corepub_default

volumes:
  db-data:
  event-data:
  event-logs:
  plausible-data:
